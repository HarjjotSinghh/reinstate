name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Run tests
        run: go test ./... -count=1

      - name: Build multi-arch binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X github.com/HarjjotSinghh/reinstate/internal/version.Version=${VERSION}"
          for pair in \
            "linux amd64" \
            "linux arm64" \
            "darwin amd64" \
            "darwin arm64" \
            "windows amd64" \
            "windows arm64"
          do
            set -- $pair
            GOOS=$1 GOARCH=$2
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
            OUT="dist/reinstate_${VERSION}_${GOOS}_${GOARCH}${EXT}"
            echo "Building $OUT"
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "$OUT" ./cmd/reinstate
          done
          cd dist
          sha256sum * > checksums.txt || shasum -a 256 * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
