name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache: true

      - name: Validate tag SemVer
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG"
          echo "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' >/dev/null

      - name: Validate signed tag, main ancestry, and changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/allowed_signers"
          git verify-tag "$TAG"
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          grep -F "## [$VERSION]" CHANGELOG.md >/dev/null
          git diff --exit-code
          PREVIOUS_TAG="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$TAG_COMMIT^" 2>/dev/null || true)"
          if test -n "$PREVIOUS_TAG"; then
            echo "GORELEASER_PREVIOUS_TAG=$PREVIOUS_TAG" >>"$GITHUB_ENV"
          fi

      - name: Run tests
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1

      # download-syft only fetches the Syft binary from GitHub releases and has
      # no retry of its own, so a transient HTTP 000 would abort a tagged
      # release before GoReleaser builds SBOMs. Repeat the same pinned action up
      # to three times with a short backoff; every failure here is a download
      # failure, so nothing real is masked.
      - name: Install Syft
        id: syft_attempt_1
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Back off before the second Syft download attempt
        if: steps.syft_attempt_1.outcome == 'failure'
        run: sleep 5

      - name: Install Syft (second attempt)
        id: syft_attempt_2
        if: steps.syft_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Back off before the final Syft download attempt
        if: steps.syft_attempt_1.outcome == 'failure' && steps.syft_attempt_2.outcome == 'failure'
        run: sleep 15

      - name: Install Syft (final attempt)
        if: steps.syft_attempt_1.outcome == 'failure' && steps.syft_attempt_2.outcome == 'failure'
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Verify Syft is on PATH
        run: syft version

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Stage raw binary assets for local verification
        run: ./scripts/stage-release-assets.sh dist

      - name: Validate release artifacts
        run: ./scripts/check-release-artifacts.sh dist

      - name: Validate release binary identity
        run: ./scripts/check-release-binary-identity.sh dist "$(git rev-parse HEAD)" "${GITHUB_REF_NAME#v}"

      - name: Generate and validate package-manager metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_DATE="$(git show -s --format=%cs "${GITHUB_REF_NAME}^{commit}")"
          ./scripts/prepare-package-manager-assets.mjs \
            --version "$VERSION" \
            --dist dist \
            --output dist/package-manager \
            --release-date "$RELEASE_DATE"
          for package_dir in dist/package-manager/npm/*; do
            (cd "$package_dir" && npm pack --dry-run --json >/dev/null)
          done
          ruby -c dist/package-manager/homebrew/Formula/reinstate.rb
          jq empty dist/package-manager/scoop/reinstate.json
          bash -n dist/package-manager/aur/PKGBUILD

      - name: Test POSIX installer contract
        run: ./scripts/test-install.sh dist

      - name: Test PowerShell release verification
        shell: pwsh
        run: ./scripts/test-install.ps1 -DistDir dist

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.rpm
            dist/*.sbom.json
            dist/checksums.txt
            dist/reinstate_*_darwin_amd64
            dist/reinstate_*_darwin_arm64
            dist/reinstate_*_linux_amd64
            dist/reinstate_*_linux_arm64
            dist/reinstate_*_windows_amd64.exe
