name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Format check
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Race
        if: runner.os == 'Linux'
        run: make test-race

      - name: Build
        run: go build -o bin/reinstate ./cmd/reinstate

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Test website
        working-directory: website
        run: npm test

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Check website SEO
        working-directory: website
        run: npm run check:seo

      - name: Check website links
        working-directory: website
        run: npm run check:links

      - name: Check website performance budgets
        working-directory: website
        run: npm run check:performance

      - name: Check synthetic path visualizer interactions
        working-directory: website
        run: npm run check:path-visualizer

      - name: Check IndexNow dry-run planning
        working-directory: website
        run: npm run check:indexnow

      - name: Check content and compatibility freshness
        working-directory: website
        run: npm run check:freshness

      - name: Run rendered-browser accessibility and SEO smoke tests
        working-directory: website
        run: npm run check:lighthouse

      - name: Upload rendered-browser reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: website/artifacts/lighthouse
          if-no-files-found: warn

      - name: Verify public installer assets
        working-directory: website
        run: |
          test -s dist/client/install.sh
          test -s dist/client/install.ps1
          cmp public/install.sh dist/client/install.sh
          cmp public/install.ps1 dist/client/install.ps1
          grep -F 'v0.1.0-rc.7' dist/client/install.sh
          grep -F 'v0.1.0-rc.7' dist/client/install.ps1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # This release is built with a toolchain new enough to lint Go 1.25.
          version: v2.11.4
          args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        run: govulncheck ./...
