name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Format check
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1

      - name: Race
        if: runner.os == 'Linux'
        run: make test-race

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/reinstate ./cmd/reinstate

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Test website
        working-directory: website
        run: npm test

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Check website SEO
        working-directory: website
        run: npm run check:seo

      - name: Check website links
        working-directory: website
        run: npm run check:links

      - name: Check website performance budgets
        working-directory: website
        run: npm run check:performance

      - name: Check synthetic path visualizer interactions
        working-directory: website
        run: npm run check:path-visualizer

      - name: Check IndexNow dry-run planning
        working-directory: website
        run: npm run check:indexnow

      - name: Check content and compatibility freshness
        working-directory: website
        run: npm run check:freshness

      - name: Run rendered-browser accessibility and SEO smoke tests
        working-directory: website
        run: npm run check:lighthouse

      - name: Upload rendered-browser reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: website/artifacts/lighthouse
          if-no-files-found: warn

      - name: Verify public installer assets
        working-directory: website
        run: |
          test -s dist/client/install.sh
          test -s dist/client/install.ps1
          cmp public/install.sh dist/client/install.sh
          cmp public/install.ps1 dist/client/install.ps1
          grep -F 'v0.3.0-rc.1' dist/client/install.sh
          grep -F 'v0.3.0-rc.1' dist/client/install.ps1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # This release is built with a toolchain new enough to lint Go 1.25.
          version: v2.11.4
          args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        run: govulncheck ./...

  release-packaging:
    name: Release packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.4.1"
          package-manager-cache: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: "v2.17.0"
          args: check

      - name: Select CLI release tags
        run: |
          set -euo pipefail
          CURRENT_TAG="$(git describe --tags --match 'v[0-9]*' --abbrev=0)"
          echo "GORELEASER_CURRENT_TAG=$CURRENT_TAG" >>"$GITHUB_ENV"
          PREVIOUS_TAG="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || true)"
          if test -n "$PREVIOUS_TAG"; then
            echo "GORELEASER_PREVIOUS_TAG=$PREVIOUS_TAG" >>"$GITHUB_ENV"
          fi

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: "v2.17.0"
          args: release --snapshot --clean --skip=publish

      - name: Validate release and package-manager assets
        run: |
          set -euo pipefail
          ./scripts/stage-release-assets.sh dist
          ./scripts/check-release-artifacts.sh dist
          VERSION="$(jq -r .version dist/metadata.json)"
          RELEASE_DATE="$(git show -s --format=%cs HEAD)"
          ./scripts/prepare-package-manager-assets.mjs \
            --version "$VERSION" \
            --dist dist \
            --output dist/package-manager \
            --release-date "$RELEASE_DATE"
          mkdir dist/npm-tarballs
          for package_dir in dist/package-manager/npm/*; do
            (cd "$package_dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist/npm-tarballs" --json >/dev/null)
          done
          npm install --prefix dist/npm-test \
            "dist/npm-tarballs/reinstate-cli-$VERSION.tgz" \
            "dist/npm-tarballs/reinstate-cli-linux-x64-$VERSION.tgz" \
            --ignore-scripts
          dist/npm-test/node_modules/.bin/rein version --json | jq -e --arg version "$VERSION" '.version == $version'
          (cd dist/package-manager/jsr && npx --yes jsr@0.14.3 publish --dry-run --allow-dirty)
          ruby -c dist/package-manager/homebrew/Formula/reinstate.rb
          ruby -e 'require "yaml"; Dir["dist/package-manager/winget/*.yaml"].each { |file| YAML.parse_file(file) or abort("invalid YAML: #{file}") }'
          jq empty dist/package-manager/scoop/reinstate.json
          bash -n dist/package-manager/aur/PKGBUILD

      - name: Parse Chocolatey PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in Get-ChildItem dist/package-manager/chocolatey/tools/*.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }

      - name: Upload package-manager snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-manager-snapshot-${{ github.sha }}
          path: dist/package-manager
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  release-packaging-windows:
    name: Release packaging (Windows)
    needs: release-packaging
    runs-on: windows-latest
    steps:
      - name: Download package-manager snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-manager-snapshot-${{ github.sha }}
          path: package-manager

      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'chocolatey-out'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Push-Location package-manager/chocolatey
          choco pack reinstate.nuspec --output-directory $output
          Pop-Location
          $package = Get-ChildItem $output/reinstate.*.nupkg | Select-Object -First 1
          if (-not $package) { throw 'Chocolatey package was not created' }

      - name: Parse Chocolatey PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in Get-ChildItem package-manager/chocolatey/tools/*.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }

      - name: Validate WinGet manifests without publication
        shell: pwsh
        env:
          WINGET_VALIDATION_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe'
          Invoke-WebRequest $url -OutFile wingetcreate.exe
          $actual = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea'
          if ($actual -ne $expected) { throw "WinGetCreate checksum mismatch: $actual" }
          $ErrorActionPreference = 'Continue'
          $validation = & ./wingetcreate.exe submit package-manager/winget --no-open --token $env:WINGET_VALIDATION_TOKEN 2>&1 | Out-String
          $submitExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $validation
          if ($validation -notmatch 'Manifest validation succeeded: True') {
            throw 'WinGetCreate did not validate the generated manifests'
          }
          if ($submitExit -eq 0) {
            throw 'Read-only WinGet validation token unexpectedly published a manifest'
          }
          exit 0
