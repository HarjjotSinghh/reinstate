name: Adapter request
description: Request support for a new AI coding agent
title: "adapter: "
labels: ["adapter", "enhancement", "triage"]
body:
  - type: input
    id: agent
    attributes:
      label: Agent name
      placeholder: e.g. Amp, Cursor, Copilot CLI
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Homepage / docs URL
    validations:
      required: true
  - type: textarea
    id: storage
    attributes:
      label: Session storage location
      description: Where does the agent store sessions on disk?
      placeholder: ~/.something/sessions/...
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Format notes
      description: JSONL? SQLite? Sample redacted header only
    validations:
      required: true
  - type: input
    id: resume
    attributes:
      label: How resume works
      placeholder: "tool --resume <id>"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this agent matters
      description: Who uses it multi-device? Any existing workarounds?
    validations:
      required: true
