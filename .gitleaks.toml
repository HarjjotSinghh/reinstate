# Gitleaks configuration for Reinstate.
#
# This file EXTENDS the upstream default rule set (`extend.useDefault = true`);
# it never replaces or disables it. Every allowlist below is scoped to a
# specific rule ID, a specific set of file paths, AND the exact synthetic
# literal that lives in those files (`condition = "AND"`), so real credentials
# committed anywhere in this repository - including in the same files - are
# still reported.
#
# Why path-scoped allowlists instead of `.gitleaksignore`:
# `.gitleaksignore` entries are fingerprints of the form
# `<commit-sha>:<path>:<rule>:<line>`. CI runs `gitleaks git` over the full
# history, and feature branches are squash-merged into `main`, which mints new
# commit SHAs. Fingerprints recorded on a branch therefore stop matching after
# the squash and the scan fails again on `main`. Path-scoped allowlists are
# commit-independent and survive the squash. The existing `.gitleaksignore`
# entry (a public host-key fingerprint quoted in an RC5 acceptance report) is
# still honoured - gitleaks loads it independently of this config.

title = "Reinstate gitleaks configuration"

[extend]
useDefault = true

# Synthetic, AWS-shaped placeholder credential: `AKIA` followed by the letters
# A-P in order. It is not a real AWS access key, has never been valid, and
# grants nothing.
#
# It exists to prove the Phase 4 security contract. `internal/secretscan` must
# redact credentials before any handoff capsule is written to disk (see
# `docs/superpowers/plans/2026-08-12-phase-4-cross-agent-handoff-plan.md`,
# section 7, rule 4: "Redaction runs before write"). The adversarial fixture
# feeds this string through the handoff pipeline and the two tests assert that
# it is replaced by a `[redacted:...]` marker. Removing or defanging the string
# would delete the meaning of the tests.
#
# `.gitleaks.toml` is listed as a path because the allowlist regex below must
# spell out the literal in order to stay exact; it is allowlisted only for that
# one literal.
[[allowlists]]
description = "Synthetic AWS-shaped placeholder used by the Phase 4 redaction tests and adversarial fixture"
targetRules = ["aws-access-token"]
condition = "AND"
paths = [
  '''^internal/handoff/security_test\.go$''',
  '''^internal/handoff/pipeline_test\.go$''',
  '''^testdata/handoff/adversarial/secret-leakage/projects/-Users-fixture-user-code-demo/session-secret-leakage\.jsonl$''',
  '''^\.gitleaks\.toml$''',
]
regexes = [
  '''^AKIAABCDEFGHIJKLMNOP$''',
]

# Synthetic transcript record identifiers (`msg_fixtureasst001`,
# `msg_fixtureuser001`) baked into the golden handoff capsules. They are
# fabricated OpenCode message IDs used to pin deterministic capsule output;
# they are not credentials and authenticate nothing. The `generic-api-key`
# rule matches them only because they follow a `"record_key":` field.
[[allowlists]]
description = "Synthetic fixture record identifiers in the golden handoff capsules"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^testdata/handoff/golden/capsule/opencode-to-claude\.json$''',
  '''^testdata/handoff/golden/capsule/opencode-to-codex\.json$''',
]
regexes = [
  '''^msg_fixture(?:asst|user)001$''',
]

# The SHA256 fingerprint of the release signing key, quoted verbatim from
# `git verify-tag` output in acceptance reports ("Good \"git\" signature ...
# ED25519 key SHA256:..."). It is the fingerprint of a *public* key: the key
# itself is committed at `.github/allowed_signers`, and every report that
# verifies a tag reproduces this line as its evidence. Publishing it is the
# point of the row.
#
# `.gitleaksignore` already carries this finding pinned to one commit and line.
# That entry has already gone stale once — the same text was re-committed at a
# different line and the scan failed again — which is exactly the decay this
# file's header predicts. A path-scoped allowlist does not move with the text.
[[allowlists]]
description = "Public release-signing key fingerprint quoted from git verify-tag in acceptance reports"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^docs/testing/results/.*\.md$''',
  '''^\.gitleaks\.toml$''',
]
regexes = [
  '''uXE5rh19MaNxQO/0pgR8n2K73xR\+ck0O7fwf351W030''',
]

# A Git packfile name from a marketplace checkout, used as an input to the
# agent probe's shape normalizer. The test asserts the normalizer collapses it
# to `pack-<40-hex>` so no content hash from an operator's own repository ever
# reaches a committed probe artifact — the string has to appear verbatim for
# the assertion to mean anything.
#
# It is the name of an object in a public repository, not a credential. The
# `sourcegraph-access-token` rule matches it on hex shape alone.
[[allowlists]]
description = "Git packfile name used as input to the agent probe shape normalizer"
targetRules = ["sourcegraph-access-token"]
condition = "AND"
paths = [
  '''^internal/agents/probe/collect_test\.go$''',
  '''^\.gitleaks\.toml$''',
]
# regexTarget = "line" because the rule's captured secret is a substring of the
# object name, not the whole `pack-...` token, so matching the secret alone
# would have to guess where the rule chose to cut.
regexTarget = "line"
regexes = [
  '''pack-8c7ffa580563b675b1fd27a53df219b761e4d0a1''',
]
