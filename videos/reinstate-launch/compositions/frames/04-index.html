  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var D = 6;

      var t1 = document.getElementById("f04-t1");
      var t2 = document.getElementById("f04-t2");
      var c1 = document.getElementById("f04-c1");
      var c2 = document.getElementById("f04-c2");

      // Two discrete typing schedules on one driver — keystroke clusters with a
      // pause at the word break, so each command reads as typed, not pasted.
      var SEQ1 = [
        { t: 0.00, text: "" },
        { t: 0.10, text: "re" },
        { t: 0.18, text: "rein" },
        { t: 0.28, text: "rein " },
        { t: 0.36, text: "rein in" },
        { t: 0.44, text: "rein ini" },
        { t: 0.52, text: "rein init" }
      ];
      var SEQ2 = [
        { t: 0.00, text: "" },
        { t: 1.38, text: "re" },
        { t: 1.46, text: "rein" },
        { t: 1.56, text: "rein " },
        { t: 1.64, text: "rein li" },
        { t: 1.72, text: "rein lis" },
        { t: 1.80, text: "rein list" }
      ];
      function at(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) if (time >= seq[i].t) return seq[i].text;
        return "";
      }

      gsap.set("#f04-ok", { opacity: 0, y: 12 });
      gsap.set("#f04-head", { opacity: 0 });
      gsap.set(".f04-r", { opacity: 0 });
      gsap.set("#f04-mark", { opacity: 0, scaleY: 0 });
      gsap.set("#f04-chip", { opacity: 0, y: 14 });
      gsap.set("#f04-c2", { opacity: 0 });
      gsap.set("#f04-tick", { strokeDasharray: 40, strokeDashoffset: 40 });

      var driver = { t: 0 };
      tl.to(driver, {
        t: D, duration: D, ease: "none",
        onUpdate: function () {
          var a = at(SEQ1, driver.t);
          if (t1.textContent !== a) t1.textContent = a;
          var b = at(SEQ2, driver.t);
          if (t2.textContent !== b) t2.textContent = b;
        }
      }, 0);

      // Deterministic caret blink; the first caret hands off to the second when
      // the second command starts typing.
      var blink = { p: 0 };
      tl.to(blink, {
        p: Math.PI * 2 * 13, duration: D, ease: "none",
        onUpdate: function () {
          var on = Math.sin(blink.p) > 0 ? "1" : "0";
          var handoff = driver.t >= 1.32;
          c1.style.opacity = handoff ? "0" : on;
          c2.style.opacity = handoff ? on : "0";
        }
      }, 0);

      // Scene 2 — the result returns; the tick draws itself.
      tl.fromTo("#f04-ok", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, 0.70);
      tl.to("#f04-tick", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.78);

      // Scene 4 — header sets, then four rows waterfall in, one per beat.
      tl.fromTo("#f04-head", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, 2.02);
      tl.fromTo(
        ".f04-r",
        { opacity: 0, y: 34 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out", stagger: 0.3 },
        2.24
      );

      // Scene 5 — the session the rest of the video follows is marked.
      tl.to("#f04-row-1", { backgroundColor: "rgba(172,237,55,0.10)", duration: 0.32, ease: "power2.out" }, 3.72);
      tl.fromTo("#f04-mark", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.3, ease: "power3.out" }, 3.76);

      // Scene 6 — the claim lands and the frame goes still.
      tl.fromTo("#f04-chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 4.62);

      window.__timelines["04-index"] = tl;
    })();
