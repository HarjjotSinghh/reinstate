<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Reinstate">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1220"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="50%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="980" cy="60" r="120" fill="#22d3ee" opacity="0.06"/>
  <circle cx="180" cy="260" r="100" fill="#34d399" opacity="0.07"/>
  <!-- devices -->
  <rect x="120" y="100" width="160" height="110" rx="10" fill="#1f2937" stroke="#34d399" stroke-width="2"/>
  <rect x="140" y="120" width="120" height="12" rx="3" fill="#374151"/>
  <rect x="140" y="142" width="90" height="8" rx="2" fill="#4b5563"/>
  <rect x="140" y="158" width="100" height="8" rx="2" fill="#4b5563"/>
  <text x="200" y="230" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="middle">desktop</text>
  <!-- cloud -->
  <ellipse cx="600" cy="150" rx="70" ry="36" fill="#1e293b" stroke="url(#accent)" stroke-width="2"/>
  <text x="600" y="156" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">encrypted</text>
  <!-- laptop -->
  <rect x="920" y="115" width="150" height="90" rx="10" fill="#1f2937" stroke="#818cf8" stroke-width="2"/>
  <rect x="938" y="132" width="114" height="12" rx="3" fill="#374151"/>
  <rect x="938" y="152" width="86" height="8" rx="2" fill="#4b5563"/>
  <rect x="938" y="168" width="96" height="8" rx="2" fill="#4b5563"/>
  <text x="995" y="230" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="middle">laptop</text>
  <!-- arrows -->
  <path d="M300 150 H510" stroke="url(#accent)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M690 150 H900" stroke="url(#accent)" stroke-width="3" fill="none"/>
  <text x="405" y="140" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">push</text>
  <text x="780" y="140" fill="#a5b4fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">pull</text>
  <!-- title -->
  <text x="600" y="60" fill="#f9fafb" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700" text-anchor="middle">Reinstate</text>
  <text x="600" y="88" fill="#9ca3af" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" text-anchor="middle">AI coding agent sessions · synced · encrypted · multi-device</text>
  <text x="600" y="290" fill="#6b7280" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" text-anchor="middle">by Harjot Singh Rana · MIT License</text>
</svg>
