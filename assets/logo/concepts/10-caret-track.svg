<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Reinstate — Caret Track</title>
  <desc id="desc">A CLI caret on a continuity track — where you are in the work, with history behind it.</desc>
  <!--
    Concept 10 · Caret Track
    CLI-native mark. Track = continuous session trail. Block caret = now.
    Pure mono: no opacity tricks — hierarchy via height only.
  -->
  <rect width="64" height="64" rx="14" fill="#131f1a"/>
  <path d="M10 42 H54" fill="none" stroke="#f4f6ef" stroke-width="3.6" stroke-linecap="round"/>
  <!-- past checkpoints along the track (increasing height toward present) -->
  <path d="M16 42 V38" stroke="#f4f6ef" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M24 42 V35" stroke="#f4f6ef" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M32 42 V31" stroke="#f4f6ef" stroke-width="3.2" stroke-linecap="round"/>
  <!-- block caret (present) -->
  <rect x="38" y="20" width="11" height="22" rx="1.5" fill="#f4f6ef"/>
</svg>
