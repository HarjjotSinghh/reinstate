<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Reinstate — Thread Hitch</title>
  <desc id="desc">A continuous thread hitched through a ring — pick up the work where you left the thread.</desc>
  <!--
    Concept 09 · Thread Hitch
    NEW direction: not a frame, letter, or stack.
    Metaphor: “pick up the thread” of a coding task — continuity as a hitch,
    not a restore arrow. Ring = workspace identity; line = session continuity.
  -->
  <rect width="64" height="64" rx="14" fill="#131f1a"/>
  <!-- ring (eyelet) -->
  <circle cx="32" cy="30" r="11" fill="none" stroke="#f4f6ef" stroke-width="3.8"/>
  <!-- thread enters from left, wraps under/through ring, continues right-down -->
  <path
    d="M8 34
       C14 34 16 34 20 32
       C24 29.5 26 26 28 26
       C31 26 33 29 33 32
       C33 36 30 39 26 39
       C22 39 20 36 20 33
       C20 38 24 44 32 46
       C42 48.5 50 46 56 42"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
