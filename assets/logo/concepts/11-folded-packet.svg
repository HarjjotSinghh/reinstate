<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Reinstate — Folded Packet</title>
  <desc id="desc">A folded geometric packet — portable sealed work you carry between machines.</desc>
  <!--
    Concept 11 · Folded Packet
    NEW direction: portable object, not path/arrow/frame.
    Metaphor: a sealed handoff packet (checkpoint) folded for transport —
    like a letter or map. Path remapping + portable handoff as a physical fold.
    Flat-vector geometry, sharp corners, mono faces via stroke only.
  -->
  <rect width="64" height="64" rx="14" fill="#131f1a"/>
  <!-- outer packet silhouette (hex-like folded envelope) -->
  <path
    d="M16 22
       L32 12
       L48 22
       L48 42
       L32 52
       L16 42
       Z"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.5"
    stroke-linejoin="round"/>
  <!-- fold crease (center valley) -->
  <path
    d="M32 12 V52"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.5"
    stroke-linecap="round"/>
  <!-- horizontal fold band (sealed contents) -->
  <path
    d="M20 32 H44"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.5"
    stroke-linecap="round"/>
</svg>
