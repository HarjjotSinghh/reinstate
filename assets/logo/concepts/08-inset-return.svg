<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Reinstate — Inset Return</title>
  <desc id="desc">Solid workspace tile with return path as inset monochrome stroke.</desc>
  <!--
    Concept 08 · Inset Return
    Bold solid tile (sealed workspace). Return path drawn inside as ink stroke.
    Maximum contrast, favicon-proof.
  -->
