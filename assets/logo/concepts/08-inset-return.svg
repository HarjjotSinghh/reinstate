  <rect x="14" y="14" width="36" height="36" rx="7" fill="#f4f6ef"/>
  <path
    d="M41 43c0-9-5.5-14.5-14.5-14.5"
    fill="none"
    stroke="#131f1a"
    stroke-width="4"
    stroke-linecap="round"/>
  <path
    d="M22.5 24.5 L26.5 28.5 L22.5 32.5"
    fill="none"
    stroke="#131f1a"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
