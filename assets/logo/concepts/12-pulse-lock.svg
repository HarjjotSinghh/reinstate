<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Reinstate — Pulse Lock</title>
  <desc id="desc">A continuity pulse sealed through a lock bar — live session, zero-knowledge at rest.</desc>
  <!--
    Concept 12 · Pulse Lock
    NEW direction: signal + trust, not geometry of windows/frames.
    Metaphor: a heartbeat/ECG-like pulse (session is alive) running through
    a horizontal seal bar (encrypted at rest). Continuity that is living
    and protected — without shields, vaults, or chat bubbles.
  -->
  <rect width="64" height="64" rx="14" fill="#131f1a"/>
  <!-- baseline seal bar -->
  <path
    d="M10 34 H22"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.6"
    stroke-linecap="round"/>
  <path
    d="M42 34 H54"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.6"
    stroke-linecap="round"/>
  <!-- pulse (live session) through the center -->
  <path
    d="M22 34
       L26 34
       L29 22
       L35 46
       L38 34
       L42 34"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- lock notch: small vertical seals at the bar joints -->
  <path d="M22 34 V40" stroke="#f4f6ef" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M42 34 V40" stroke="#f4f6ef" stroke-width="3.6" stroke-linecap="round"/>
</svg>
