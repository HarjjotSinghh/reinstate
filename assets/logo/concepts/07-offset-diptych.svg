<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Reinstate — Offset Diptych</title>
  <desc id="desc">Two offset workspace frames with classic terminal prompt (greater-than + cursor).</desc>
  <!--
    07 · Offset Diptych + classic terminal glyph:  >_
    Reference: common terminal app icons (prompt caret + underscore cursor).
  -->
  <rect width="64" height="64" rx="14" fill="#131f1a"/>
  <rect x="11" y="11" width="30" height="30" rx="5.5" fill="none" stroke="#f4f6ef" stroke-width="3.5"/>
  <rect x="23" y="23" width="30" height="30" rx="5.5" fill="#131f1a" stroke="#f4f6ef" stroke-width="3.5"/>
  <!-- prompt: > -->
  <path
    d="M30 32 L36 38 L30 44"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- cursor: _ -->
  <path
    d="M40 44 H48"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.4"
    stroke-linecap="round"/>
</svg>
