<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Reinstate — Monoline Reentry</title>
  <desc id="desc">One continuous stroke: open workspace frame with restore path as a single monochrome line.</desc>
  <!--
    Concept 05 · Monoline Reentry
    Evolution of Restore Frame as a single continuous stroke.
    Open frame (gap at SE) + arc + chevron tip — one weight throughout.
  -->
  <rect width="64" height="64" rx="14" fill="#131f1a"/>
  <!-- open frame: NW → NE → SE stop, then SW → NW -->
  <path
    d="M20 48
       C16.5 48 14 45.5 14 42
       L14 22
       C14 18.5 16.5 16 20 16
       L42 16
       C45.5 16 48 18.5 48 22
       L48 36"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- restore arc + tip (same stroke weight) -->
  <path
    d="M48 44
       C48 36 42 30 32 30
       M32 30 L28 26
       M32 30 L28 34"
    fill="none"
    stroke="#f4f6ef"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
