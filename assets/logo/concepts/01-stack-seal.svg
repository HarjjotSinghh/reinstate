<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Reinstate — Stack Seal (mono)</title>
  <desc id="desc">Four continuity layers sealed as a portable monochrome mark.</desc>
  <!-- Concept 01 · Stack Seal · monochrome — clean bars + outline lock -->
  <rect width="64" height="64" rx="14" fill="#131f1a"/>
  <!-- four slabs with slight visual hierarchy via width only (still mono) -->
  <rect x="14" y="12" width="36" height="7" rx="1.8" fill="#f4f6ef"/>
  <rect x="14" y="22" width="36" height="7" rx="1.8" fill="#f4f6ef"/>
  <rect x="14" y="32" width="36" height="7" rx="1.8" fill="#f4f6ef"/>
  <rect x="14" y="42" width="36" height="7" rx="1.8" fill="#f4f6ef"/>
  <!-- outline padlock overlay (cut hole via dark body + white stroke) -->
  <rect x="38" y="36" width="13" height="11" rx="2.2" fill="#131f1a" stroke="#f4f6ef" stroke-width="2"/>
  <path d="M41.2 36v-3.2a3.3 3.3 0 0 1 6.6 0V36" fill="none" stroke="#f4f6ef" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44.5" cy="41.5" r="1.5" fill="#f4f6ef"/>
</svg>
