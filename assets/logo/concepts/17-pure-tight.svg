<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Reinstate — Pure Tight</title>
  <desc id="desc">Selected mark: dual offset frames with classic terminal prompt. Dark app icon.</desc>
  <!-- Chosen logo · Pure Tight · dark master geometry -->
  <rect width="64" height="64" rx="14" fill="#131f1a"/>
  <!-- back frame -->
  <rect x="14" y="14" width="28" height="28" rx="5.5" fill="none" stroke="#f4f6ef" stroke-width="3.6"/>
  <!-- front frame (fill matches bg so back stroke is cleanly occluded) -->
  <rect x="22" y="22" width="28" height="28" rx="5.5" fill="#131f1a" stroke="#f4f6ef" stroke-width="3.6"/>
  <!-- terminal prompt >_ (smaller) -->
  <path d="M30.5 33 L34.5 37 L30.5 41" fill="none" stroke="#f4f6ef" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37 41 H42.5" fill="none" stroke="#f4f6ef" stroke-width="2.7" stroke-linecap="round"/>
</svg>
