<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="1320" viewBox="0 0 2320 1320" role="img" aria-labelledby="title description">
  <title id="title">Agent scope versus state portability</title>
  <desc id="description">A positioning chart comparing coding-agent tools by agent coverage and state portability, with Reinstate highlighted in the universal portable-state gap.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#91a09a" />
    </marker>
  </defs>
  <style>
    text { font-family: Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #17231e; }
    .title { font-size: 42px; font-weight: 720; letter-spacing: -0.7px; }
    .subtitle { font-size: 27px; fill: #5f6d67; }
    .body { font-size: 24px; }
    .small { font-size: 20px; fill: #5f6d67; }
    .tiny { font-size: 17px; fill: #5f6d67; }
    .axis { font-size: 23px; font-weight: 680; }
    .label { font-size: 23px; fill: #5f6d67; }
    .strong { font-size: 24px; font-weight: 700; }
    .accent { font-size: 25px; font-weight: 740; fill: #4d8f18; }
    .nodeTitle, .nodeDetail { font-size: 23px; font-weight: 700; fill: #fff; }
    .nodeDetail { font-size: 21px; font-weight: 570; }
    @media (prefers-color-scheme: dark) {
      text { fill: #eef3ed; }
      .subtitle, .small, .tiny, .label { fill: #b8c4be; }
      .accent { fill: #b8ff3c; }
      .nodeTitle, .nodeDetail { fill: #fff; }
      [stroke="#e4e9e4"] { stroke: #3d5047; }
      [stroke="#cfd7cf"] { stroke: #61736a; }
      [stroke="#91a09a"] { stroke: #8fa198; }
      [fill="#91a09a"] { fill: #8fa198; }
    }
  </style>
  <text x="1160" y="62" class="title" text-anchor="middle" ><tspan x="1160" dy="0">Where everyone sits: agent scope vs. state portability</tspan></text><line x1="140" y1="120" x2="140" y2="1195" stroke="#91a09a" stroke-width="2" /><line x1="140" y1="1195" x2="2240" y2="1195" stroke="#91a09a" stroke-width="2" /><line x1="1190" y1="120" x2="1190" y2="1195" stroke="#cfd7cf" stroke-width="2" stroke-dasharray="9 8" /><line x1="140" y1="660" x2="2240" y2="660" stroke="#cfd7cf" stroke-width="2" stroke-dasharray="9 8" /><line x1="130" y1="335" x2="140" y2="335" stroke="#91a09a" stroke-width="2" /><line x1="130" y1="550" x2="140" y2="550" stroke="#91a09a" stroke-width="2" /><line x1="130" y1="770" x2="140" y2="770" stroke="#91a09a" stroke-width="2" /><line x1="130" y1="985" x2="140" y2="985" stroke="#91a09a" stroke-width="2" /><line x1="560" y1="1195" x2="560" y2="1205" stroke="#91a09a" stroke-width="2" /><line x1="980" y1="1195" x2="980" y2="1205" stroke="#91a09a" stroke-width="2" /><line x1="1400" y1="1195" x2="1400" y2="1205" stroke="#91a09a" stroke-width="2" /><line x1="1820" y1="1195" x2="1820" y2="1205" stroke="#91a09a" stroke-width="2" /><text x="180" y="168" class="subtitle" text-anchor="start" font-style="italic"><tspan x="180" dy="0">Native cloud sessions</tspan><tspan x="180" dy="25">(vendor-locked)</tspan></text><text x="180" y="1140" class="subtitle" text-anchor="start" font-style="italic"><tspan x="180" dy="0">Local CLI agents</tspan><tspan x="180" dy="25">(default today)</tspan></text><text x="1964" y="1140" class="subtitle" text-anchor="start" font-style="italic"><tspan x="1964" dy="0">Cross-tool config sync</tspan><tspan x="1964" dy="25">(same machine only)</tspan></text><text x="1880" y="175" class="accent" text-anchor="start" ><tspan x="1880" dy="0">THE GAP: universal,</tspan><tspan x="1880" dy="27">portable agent state</tspan></text><circle cx="370" cy="215" r="14" fill="#6657e8" stroke="#ffffff" stroke-width="3" /><text x="396" y="223" class="label" text-anchor="start" ><tspan x="396" dy="0">Claude Code on web</tspan></text><circle cx="520" cy="315" r="14" fill="#28bd94" stroke="#ffffff" stroke-width="3" /><text x="547" y="323" class="label" text-anchor="start" ><tspan x="547" dy="0">Codex CLI + ChatGPT sync</tspan></text><circle cx="790" cy="380" r="14" fill="#8a5cf1" stroke="#ffffff" stroke-width="3" /><text x="817" y="388" class="label" text-anchor="start" ><tspan x="817" dy="0">claude-sync</tspan></text><circle cx="645" cy="475" r="14" fill="#28a9df" stroke="#ffffff" stroke-width="3" /><text x="672" y="483" class="label" text-anchor="start" ><tspan x="672" dy="0">antigravity-storage-manager</tspan></text><circle cx="750" cy="590" r="14" fill="#6657e8" stroke="#ffffff" stroke-width="3" /><text x="612" y="560" class="label" text-anchor="start" ><tspan x="612" dy="0">Anthropic Remote Control</tspan></text><circle cx="938" cy="700" r="14" fill="#f3a11a" stroke="#ffffff" stroke-width="3" /><text x="826" y="670" class="label" text-anchor="start" ><tspan x="826" dy="0">Happy (mobile relay)</tspan></text><circle cx="1378" cy="455" r="14" fill="#8a5cf1" stroke="#ffffff" stroke-width="3" /><text x="1405" y="463" class="label" text-anchor="start" ><tspan x="1405" dy="0">coding-agent-sync</tspan></text><circle cx="1190" cy="840" r="14" fill="#a6b3c5" stroke="#ffffff" stroke-width="3" /><text x="1055" y="808" class="label" text-anchor="start" ><tspan x="1055" dy="0">Git / Syncthing / NAS DIY</tspan></text><circle cx="1462" cy="960" r="14" fill="#a6b3c5" stroke="#ffffff" stroke-width="3" /><text x="1489" y="968" class="label" text-anchor="start" ><tspan x="1489" dy="0">mcp-sync / MCP Manager</tspan></text><circle cx="1673" cy="1045" r="14" fill="#f3a11a" stroke="#ffffff" stroke-width="3" /><text x="1476" y="1014" class="label" text-anchor="start" ><tspan x="1476" dy="0">Vibe Kanban / Conductor / Nimbalyst</tspan></text><circle cx="580" cy="1014" r="14" fill="#28bd94" stroke="#ffffff" stroke-width="3" /><text x="607" y="1022" class="label" text-anchor="start" ><tspan x="607" dy="0">OpenCode</tspan></text><circle cx="392" cy="1067" r="14" fill="#6657e8" stroke="#ffffff" stroke-width="3" /><text x="420" y="1075" class="label" text-anchor="start" ><tspan x="420" dy="0">Claude Code (local CLI)</tspan></text><circle cx="476" cy="1120" r="14" fill="#28a9df" stroke="#ffffff" stroke-width="3" /><text x="504" y="1128" class="label" text-anchor="start" ><tspan x="504" dy="0">Gemini CLI</tspan></text><circle cx="685" cy="1078" r="14" fill="#4b5868" stroke="#ffffff" stroke-width="3" /><text x="713" y="1086" class="label" text-anchor="start" ><tspan x="713" dy="0">Grok Build</tspan></text><circle cx="1960" cy="245" r="23" fill="#b8ff3c" stroke="#17231e" stroke-width="4" /><text x="1922" y="253" class="accent" text-anchor="end" ><tspan x="1922" dy="0">Reinstate (this project)</tspan></text><text x="1160" y="1275" class="axis" text-anchor="middle" ><tspan x="1160" dy="0">Agent coverage  →  (single agent → universal)</tspan></text><text x="52" y="700" class="axis" text-anchor="middle" transform="rotate(-90 52 700)">State portability  →  (local-only → cloud-synced)</text>
</svg>
