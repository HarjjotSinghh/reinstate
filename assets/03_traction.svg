<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="1120" aria-labelledby="title description" role="img" viewBox="0 0 2320 1120"><title id="title">Agent CLI and sync-tool GitHub traction</title><desc id="description">A logarithmic horizontal bar chart comparing GitHub star counts for major agent CLIs, orchestrators, relays, and session sync tools as fetched on July 25, 2026.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#91a09a" d="M0,0 L10,5 L0,10 Z"/></marker></defs><style>text{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif;fill:#17231e}.title{font-size:42px;font-weight:720;letter-spacing:-.7px}.subtitle{font-size:27px;fill:#5f6d67}.body,.strong{font-size:24px}.strong{font-weight:700}@media (prefers-color-scheme:dark){text{fill:#eef3ed}.subtitle{fill:#b8c4be}[stroke=&quot;#e4e9e4&quot;]{stroke:#3d5047}[stroke=&quot;#cfd7cf&quot;]{stroke:#61736a}[stroke=&quot;#91a09a&quot;]{stroke:#8fa198}[fill=&quot;#91a09a&quot;]{fill:#8fa198}}</style><text x="1160" y="62" class="title" text-anchor="middle"><tspan x="1160" dy="0">Agent CLIs are massive — the sync layer is still up for grabs</tspan></text><text x="1160" y="108" class="subtitle" text-anchor="middle"><tspan x="1160" dy="0">GitHub stars, fetched 2026-07-25 (log scale)</tspan></text><line x1="500" x2="500" y1="150" y2="1040" stroke="#e4e9e4" stroke-width="1.5"/><text x="500" y="1080" class="body" text-anchor="middle"><tspan x="500" dy="0">10</tspan></text><line x1="868.54" x2="868.54" y1="150" y2="1040" stroke="#e4e9e4" stroke-width="1.5"/><text x="868.54" y="1080" class="body" text-anchor="middle"><tspan x="868.54" dy="0">100</tspan></text><line x1="1237.081" x2="1237.081" y1="150" y2="1040" stroke="#e4e9e4" stroke-width="1.5"/><text x="1237.081" y="1080" class="body" text-anchor="middle"><tspan x="1237.081" dy="0">1,000</tspan></text><line x1="1605.621" x2="1605.621" y1="