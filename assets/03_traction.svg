span></text><text x="482" y="899" class="body" text-anchor="end" ><tspan x="482" dy="0">claude-sync (sync tool)</tspan></text><rect x="500" y="870" width="501.15429496030197" height="44" rx="8" fill="#8a5cf1" /><text x="1013.154294960302" y="899" class="strong" text-anchor="start" ><tspan x="1013.154294960302" dy="0">229</tspan></text><text x="482" y="998" class="body" text-anchor="end" ><tspan x="482" dy="0">mcp-sync (sync tool)</tspan></text><rect x="500" y="969" width="244.25302779588674" height="44" rx="8" fill="#8a5cf1" /><text x="756.2530277958867" y="998" class="strong" text-anchor="start" ><tspan x="756.2530277958867" dy="0">46</tspan></text>
