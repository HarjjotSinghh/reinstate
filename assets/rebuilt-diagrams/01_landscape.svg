<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="1320" aria-labelledby="title description" role="img" viewBox="0 0 2320 1320"><title id="title">Agent scope versus state portability</title><desc id="description">A positioning chart comparing coding-agent tools by agent coverage and state portability, with Reinstate highlighted in the universal portable-state gap.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#91a09a" d="M0,0 L10,5 L0,10 Z"/></marker></defs><style>text{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif;fill:#17231e}.title{font-size:42px;font-weight:720;letter-spacing:-.7px}.subtitle{font-size:27px;fill:#5f6d67}.axis,.label{font-size:23px}.axis{font-weight:680}.label{fill:#5f6d67}.accent{font-size:25px;font-weight:740;fill:#4d8f18}</style><rect width="2320" height="1320" fill="#fff"/><text x="1160" y="62" class="title" text-anchor="middle"><tspan x="1160" dy="0">Where everyone sits: agent scope vs. state portability</tspan></text><line x1="140" x2="140" y1="120" y2="1195" stroke="#91a09a" stroke-width="2"/><line x1="140" x2="2240" y1="1195" y2="1195" stroke="#91a09a" stroke-width="2"/><line x1="1190" x2="1190" y1="120" y2="1195" stroke="#cfd7cf" stroke-dasharray="9 8" stroke-width="2"/><line x1="140" x2="2240" y1="660" y2="660" stroke="#cfd7cf" stroke-dasharray="9 8" stroke-width="2"/><line x1="130" x2="140" y1="335" y2="335" stroke="#91a09a" stroke-width="2"/><line x1="130" x2="140" y1="550" y2="550" stroke="#91a09a" stroke-width="2"/><line x1="130" x2="140" y1="770" y2="770" stroke="#91a09a" stroke-width="2"/><line x1="130" x2="140" y1="985" y2="985" stroke="#91a09a" stroke-width="2"/><line x1="560" x2="560" y1="1195" y2="1205" stroke="#91a09a" stroke-width="2"/><line x1="980" x2="980" y1="1195" y2="1205" stroke="#91a09a" stroke-width="2"/><line x1="1400" x2="1400" y1="1195" y2="1205" stroke="#91a09a" stroke-width="2"/><line x1="1820" x2="1820" y1="1195" y2="1205" stroke="#91a09a" stroke-width="2"/><text x="180" y="168" class="subtitle" font-style="italic" text-anchor="start"><tspan x="180" dy="0">Native cloud sessions</tspan><tspan x="180" dy="25">(vendor-locked)</tspan></text><text x="180" y="1140" class="subtitle" font-style="italic" text-anchor="start"><tspan x="180" dy="0">Local CLI agents</tspan><tspan x="180" dy="25">(default today)</tspan></text><text x="1964" y="1140" class="subtitle" font-style="italic" text-anchor="start"><tspan x="1964" dy="0">Cross-tool config sync</tspan><tspan x="1964" dy="25">(same machine only)</tspan></text><text x="1880" y="175" class="accent" text-anchor="start"><tspan x="1880" dy="0">THE GAP: universal,</tspan><tspan x="1880" dy="27">portable agent state</tspan></text><circle cx="370" cy="215" r="14" fill="#6657e8" stroke="#fff" stroke-width="3"/><text x="396" y="223" class="label" text-anchor="start"><tspan x="396" dy="0">Claude Code on web</tspan></text><circle cx="520" cy="315" r="14" fill="#28bd94" stroke="#fff" stroke-width="3"/><text x="547" y="323" class="label" text-anchor="start"><tspan x="547" dy="0">Codex CLI + ChatGPT sync</tspan></text><circle cx="790" cy="380" r="14" fill="#8a5cf1" stroke="#fff" stroke-width="3"/><text x="817" y="388" class="label" text-anchor="start"><tspan x="817" dy="0">claude-sync</tspan></text><circle cx="645" cy="475" r="14" fill="#28a9df" stroke="#fff" stroke-width="3"/><text x="672" y="483" class="label" text-anchor="start"><tspan x="672" dy="0">antigravity-storage-manager</tspan></text><circle cx="750" cy="590" r="14" fill="#6657e8" stroke="#fff" stroke-width="3"/><text x="612" y="560" class="label" text-anchor="start"><tspan x="612" dy="0">Anthropic Remote Control</tspan></text><circle cx="938" cy="700" r="14" fill="#f3a11a" stroke="#fff" stroke-width="3"/><text x="826" y="670" class="label" text-anchor="start"><tspan x="826" dy="0">Happy (mobile relay)</tspan></text><circle cx="1378" cy="4