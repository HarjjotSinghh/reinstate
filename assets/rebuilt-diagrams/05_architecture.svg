<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1360" aria-labelledby="title description" role="img" viewBox="0 0 2560 1360"><title id="title">Reinstate architecture</title><desc id="description">The Reinstate MVP pipeline watches agent state, normalizes paths, encrypts locally, syncs ciphertext to a user-selected backend, restores on another device, and resumes with the native agent.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#91a09a" d="M0,0 L10,5 L0,10 Z"/></marker></defs><style>text{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif;fill:#17231e}.title{font-size:42px;font-weight:720;letter-spacing:-.7px}.subtitle{font-size:27px;fill:#5f6d67}.nodeTitle{font-size:23px;font-weight:700;fill:#fff}</style><rect width="2560" height="1360" fill="#fff"/><text x="1280" y="66" class="title" text-anchor="middle"><tspan x="1280" dy="0">Reinstate MVP: one pipeline, every agent, any backend</tspan></text><line x1="405" x2="625" y1="250" y2="575" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="405" x2="625" y1="420" y2="595" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="405" x2="625" y1="590" y2="615" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="405" x2="625" y1="760" y2="635" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="405" x2="625" y1="930" y2="655" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="755" x2="755" y1="320" y2="535" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="970" x2="1110" y1="615" y2="615" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="1500" x2="1620" y1="615" y2="615" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="1815" x2="1815" y1="535" y2="390" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="2035" x2="2100" y1="295" y2="295" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="2295" x2="2295" y1="390" y2="690" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="2010" x2="2110" y1="650" y2="730" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><line x1="2210" x2="1800" y1="850" y2="1040" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)"/><rect width="345" height="110" x="60" y="195" fill="#6657e8" stroke="#fff" stroke-width="3" rx="24"/><text x="232.5" y="243.5" class="nodeTitle" text-anchor="middle"><tspan x="232.5" dy="0">Claude Code</tspan><tspan x="232.5" dy="27">$HOME/.claude/projects/*.jsonl</tspan></text><rect width="345" height="110" x="60" y="365" fill="#28bd94" stroke="#fff" stroke-width="3" rx="24"/><text x="232.5" y="413.5" class="nodeTitle" text-anchor="middle"><tspan x="232.5" dy="0">Codex CLI</tspan><tspan x="232.5" dy="27">$HOME/.codex/sessions/.../rollout-*.jsonl</tspan></text><rect width="345" height="110" x="60" y="535" fill="#28a9df" stroke="#fff" stroke-width="3" rx="24"/><text x="232.5" y="583.5" class="nodeTitle" text-anchor="middle"><tspan x="232.5" dy="0">Gemini CLI</tspan><tspan x="232.5" dy="27">$HOME/.gemini/tmp/&lt;hash&gt;/chats/*.json</tspan></text><rect width="345" height="110" x="60" y="705" fill="#22b6a7" stroke="#fff" stroke-width="3" rx="24"/><text x="232.5" y="753.5" class="nodeTitle" text-anchor="middle"><tspan x="232.5" dy="0">OpenCode</tspan><tspan x="232.5" dy="27">$HOME/.local/share/opencode/</tspan></text><rect width="345" height="110" x="60" y="875" fill="#24323d" stroke="#fff" stroke-width="3" rx="24"/><text x="232.5" y="923.5" class="nodeTitle" text-anchor="middle"><tspan x="232.5" dy="0">Grok Build</tspan><tspan x="232.5" dy="27">$HOME/.grok/ sessions</tspan></text><rect width="470" height="155" x="520" y="165" fill="#f3a11a" stroke="#fff" stroke-width="3" rx="24"/><text x="755" y="222.5" class="nodeTitle" text-anchor="middle"><tspan x="755" dy="0">REINSTATE CONFIG</tspan><tspan x="755" dy="27">MCP servers · skills · agents</tspan><tspan x="755" dy="27">rules · settings</tspan></text><rect width="345" height="160" x="625" y="535" fill="#8a5cf1" stroke="#fff" stroke-width="3" rx="24"/><text x="797.5" y="595" class="nodeTitle" text-anchor="middle"><tspan x="797.5" dy="0">1 · WATCHER</tspan><tspan x="797.5" dy="27">fs events, debounce,</tspan><tspan x="797.5" dy="27">append-aware diffs</tspan></text><rect width="390" height="160" x="1110" y="535" fill="#8a5cf1" stroke="#fff" stroke-width="3" rx="24"/><text x="1305" y="581.5" class="nodeTitle" text-anchor="middle"><tspan x="1305" dy="0">2 · NORMALIZER</tspan><tspan x="1305" dy="27">path tokens (${HOME},</tspan><tspan x="1305" dy="27">${WORK}) · ignore rules</tspan><tspan x="1305" dy="27">· secret redaction</tspan></text><rect width="390" height="160" x="1620" y="535" fill="#ef4d4d" stroke="#fff" stroke-width="3" rx="24"/><text x="1815" y="595" class="nodeTitle" text-anchor="middle"><tspan x="1815" dy="0">3 · ENCRYPT</tspan><tspan x="1815" dy="27">age / AES-256-GCM,</tspan><tspan x="1815" dy="27">passphrase-derived keys</tspan></text><rect width="420" height="160" x="1615" y="230" fill="#f3a11a" stroke="#fff" stroke-width="3" rx="24"/><text x="1825" y="290" class="nodeTitle" text-anchor="middle"><tspan x="1825" dy="0">4 · SYNC ENGINE</tspan><tspan x="1825" dy="27">SQLite manifest · delta sync</tspan><tspan x="1825" dy="27">· conflict detection</tspan></text><rect width="400" height="160" x="2100" y="230" fill="#728399" stroke="#fff" stroke-width="3" rx="24"/><text x="2300" y="290" class="nodeTitle" text-anchor="middle"><tspan x="2300" dy="0">CLOUD BACKENDS (BYO)</tspan><tspan x="2300" dy="27">R2 · S3 · GCS · WebDAV · Gist</tspan><tspan x="2300" dy="27">ciphertext only</tspan></text><rect width="390" height="160" x="2110" y="690" fill="#6657e8" stroke="#fff" stroke-width="3" rx="24"/><text x="2305" y="750" class="nodeTitle" text-anchor="middle"><tspan x="2305" dy="0">5 · RESTORE (device B)</tspan><tspan x="2305" dy="27">pull · decrypt · path-rewrite</tspan><tspan x="2305" dy="27">· atomic swap + backup</tspan></text><rect width="590" height="160" x="1390" y="1040" fill="#22b6a7" stroke="#fff" stroke-width="3" rx="24"/><text x="1685" y="1100" class="nodeTitle" text-anchor="middle"><tspan x="1685" dy="0">resume anywhere:</tspan><tspan x="1685" dy="27">claude --resume · codex resume ·</tspan><tspan x="1685" dy="27">gemini --resume · opencode · grok -r</tspan></text><text x="72" y="1260" class="subtitle" text-anchor="start"><tspan x="72" dy="0">Device A (write path)</tspan></text><line x1="335" x2="1170" y1="1252" y2="1252" stroke="#91a09a" stroke-width="2" marker-end="url(#arrow)"/><text x="1200" y="1260" class="subtitle" text-anchor="start"><tspan x="1200" dy="0">cloud</tspan></text><line x1="1270" x2="1435" y1="1252" y2="1252" stroke="#91a09a" stroke-width="2" marker-end="url(#arrow)"/><text x="1465" y="1260" class="subtitle" text-anchor="start"><tspan x="1465" dy="0">Device B (read path)</tspan></text><text x="72" y="1310" class="subtitle" text-anchor="start"><tspan x="72" dy="0">Encryption happens before anything leaves the machine — backends never see plaintext.</tspan></text></svg>