<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1360" viewBox="0 0 2560 1360" role="img" aria-labelledby="title description">
  <title id="title">Reinstate architecture</title>
  <desc id="description">The Reinstate MVP pipeline watches agent state, normalizes paths, encrypts locally, syncs ciphertext to a user-selected backend, restores on another device, and resumes with the native agent.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#91a09a" />
    </marker>
  </defs>
  <style>
    text { font-family: Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #17231e; }
    .title { font-size: 42px; font-weight: 720; letter-spacing: -0.7px; }
    .subtitle { font-size: 27px; fill: #5f6d67; }
    .body { font-size: 24px; }
    .small { font-size: 20px; fill: #5f6d67; }
    .tiny { font-size: 17px; fill: #5f6d67; }
    .axis { font-size: 23px; font-weight: 680; }
    .label { font-size: 23px; fill: #5f6d67; }
    .strong { font-size: 24px; font-weight: 700; }
    .accent { font-size: 25px; font-weight: 740; fill: #4d8f18; }
    .nodeTitle, .nodeDetail { font-size: 23px; font-weight: 700; fill: #fff; }
    .nodeDetail { font-size: 21px; font-weight: 570; }
  </style>
  <rect width="2560" height="1360" fill="#ffffff" />
  <text x="1280" y="66" class="title" text-anchor="middle" ><tspan x="1280" dy="0">Reinstate MVP: one pipeline, every agent, any backend</tspan></text><line x1="405" y1="250" x2="625" y2="575" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="405" y1="420" x2="625" y2="595" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="405" y1="590" x2="625" y2="615" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="405" y1="760" x2="625" y2="635" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="405" y1="930" x2="625" y2="655" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="755" y1="320" x2="755" y2="535" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="970" y1="615" x2="1110" y2="615" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="1500" y1="615" x2="1620" y2="615" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="1815" y1="535" x2="1815" y2="390" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="2035" y1="295" x2="2100" y2="295" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="2295" y1="390" x2="2295" y2="690" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="2010" y1="650" x2="2110" y2="730" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><line x1="2210" y1="850" x2="1800" y2="1040" stroke="#cfd7cf" stroke-width="4" marker-end="url(#arrow)" /><rect x="60" y="195" width="345" height="110" rx="24" fill="#6657e8" stroke="#ffffff" stroke-width="3" /><text x="232.5" y="243.5" class="nodeTitle" text-anchor="middle" ><tspan x="232.5" dy="0">Claude Code</tspan><tspan x="232.5" dy="27">$HOME/.claude/projects/*.jsonl</tspan></text><rect x="60" y="365" width="345" height="110" rx="24" fill="#28bd94" stroke="#ffffff" stroke-width="3" /><text x="232.5" y="413.5" class="nodeTitle" text-anchor="middle" ><tspan x="232.5" dy="0">Codex CLI</tspan><tspan x="232.5" dy="27">$HOME/.codex/sessions/.../rollout-*.jsonl</tspan></text><rect x="60" y="535" width="345" height="110" rx="24" fill="#28a9df" stroke="#ffffff" stroke-width="3" /><text x="232.5" y="583.5" class="nodeTitle" text-anchor="middle" ><tspan x="232.5" dy="0">Gemini CLI</tspan><tspan x="232.5" dy="27">$HOME/.gemini/tmp/&lt;hash&gt;/chats/*.json</tspan></text><rect x="60" y="705" width="345" height="110" rx="24" fill="#22b6a7" stroke="#ffffff" stroke-width="3" /><text x="232.5" y="753.5" class="nodeTitle" text-anchor="middle" ><tspan x="232.5" dy="0">OpenCode</tspan><tspan x="232.5" dy="27">$HOME/.local/share/opencode/</tspan></text><rect x="60" y="875" width="345" height="110" rx="24" fill="#24323d" stroke="#ffffff" stroke-width="3" /><text x="232.5" y="923.5" class="nodeTitle" text-anchor="middle" ><tspan x="232.5" dy="0">Grok Build</tspan><tspan x="232.5" dy="27">$HOME/.grok/ sessions</tspan></text><rect x="520" y="165" width="470" height="155" rx="24" fill="#f3a11a" stroke="#ffffff" stroke-width="3" /><text x="755" y="222.5" class="nodeTitle" text-anchor="middle" ><tspan x="755" dy="0">REINSTATE CONFIG</tspan><tspan x="755" dy="27">MCP servers · skills · agents</tspan><tspan x="755" dy="27">rules · settings</tspan></text><rect x="625" y="535" width="345" height="160" rx="24" fill="#8a5cf1" stroke="#ffffff" stroke-width="3" /><text x="797.5" y="595" class="nodeTitle" text-anchor="middle" ><tspan x="797.5" dy="0">1 · WATCHER</tspan><tspan x="797.5" dy="27">fs events, debounce,</tspan><tspan x="797.5" dy="27">append-aware diffs</tspan></text><rect x="1110" y="535" width="390" height="160" rx="24" fill="#8a5cf1" stroke="#ffffff" stroke-width="3" /><text x="1305" y="581.5" class="nodeTitle" text-anchor="middle" ><tspan x="1305" dy="0">2 · NORMALIZER</tspan><tspan x="1305" dy="27">path tokens (${HOME},</tspan><tspan x="1305" dy="27">${WORK}) · ignore rules</tspan><tspan x="1305" dy="27">· secret redaction</tspan></text><rect x="1620" y="535" width="390" height="160" rx="24" fill="#ef4d4d" stroke="#ffffff" stroke-width="3" /><text x="1815" y="595" class="nodeTitle" text-anchor="middle" ><tspan x="1815" dy="0">3 · ENCRYPT</tspan><tspan x="1815" dy="27">age / AES-256-GCM,</tspan><tspan x="1815" dy="27">passphrase-derived keys</tspan></text><rect x="1615" y="230" width="420" height="160" rx="24" fill="#f3a11a" stroke="#ffffff" stroke-width="3" /><text x="1825" y="290" class="nodeTitle" text-anchor="middle" ><tspan x="1825" dy="0">4 · SYNC ENGINE</tspan><tspan x="1825" dy="27">SQLite manifest · delta sync</tspan><tspan x="1825" dy="27">· conflict detection</tspan></text><rect x="2100" y="230" width="400" height="160" rx="24" fill="#728399" stroke="#ffffff" stroke-width="3" /><text x="2300" y="290" class="nodeTitle" text-anchor="middle" ><tspan x="2300" dy="0">CLOUD BACKENDS (BYO)</tspan><tspan x="2300" dy="27">R2 · S3 · GCS · WebDAV · Gist</tspan><tspan x="2300" dy="27">ciphertext only</tspan></text><rect x="2110" y="690" width="390" height="160" rx="24" fill="#6657e8" stroke="#ffffff" stroke-width="3" /><text x="2305" y="750" class="nodeTitle" text-anchor="middle" ><tspan x="2305" dy="0">5 · RESTORE (device B)</tspan><tspan x="2305" dy="27">pull · decrypt · path-rewrite</tspan><tspan x="2305" dy="27">· atomic swap + backup</tspan></text><rect x="1390" y="1040" width="590" height="160" rx="24" fill="#22b6a7" stroke="#ffffff" stroke-width="3" /><text x="1685" y="1100" class="nodeTitle" text-anchor="middle" ><tspan x="1685" dy="0">resume anywhere:</tspan><tspan x="1685" dy="27">claude --resume · codex resume ·</tspan><tspan x="1685" dy="27">gemini --resume · opencode · grok -r</tspan></text><text x="72" y="1260" class="subtitle" text-anchor="start" ><tspan x="72" dy="0">Device A (write path)</tspan></text><line x1="335" y1="1252" x2="1170" y2="1252" stroke="#91a09a" stroke-width="2" marker-end="url(#arrow)" /><text x="1200" y="1260" class="subtitle" text-anchor="start" ><tspan x="1200" dy="0">cloud</tspan></text><line x1="1270" y1="1252" x2="1435" y2="1252" stroke="#91a09a" stroke-width="2" marker-end="url(#arrow)" /><text x="1465" y="1260" class="subtitle" text-anchor="start" ><tspan x="1465" dy="0">Device B (read path)</tspan></text><text x="72" y="1310" class="subtitle" text-anchor="start" ><tspan x="72" dy="0">Encryption happens before anything leaves the machine — backends never see plaintext.</tspan></text>
</svg>