version: "2"

run:
  timeout: 5m
  # Language version for analysis; CI installs Go 1.25.12 for builds/govulncheck.
  go: "1.24"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/HarjjotSinghh/reinstate
