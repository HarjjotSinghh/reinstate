version: 2

project_name: reinstate

before:
  hooks:
    - go mod tidy

builds:
  - id: reinstate
    main: ./cmd/reinstate
    binary: reinstate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/HarjjotSinghh/reinstate/internal/version.Version={{.Version}}
      - -X github.com/HarjjotSinghh/reinstate/internal/version.Commit={{.ShortCommit}}
      - -X github.com/HarjjotSinghh/reinstate/internal/version.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SBOM generation requires syft in PATH; release CI can enable separately.
# Local snapshot gates must produce archives + checksums without optional tools.

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  prerelease: auto
